name: Bug Report
description: File a bug report for mongo-next-sentinel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the problem with details below.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Next.js version, MongoDB Node driver version, runtime (Node.js/Bun/Vercel)
